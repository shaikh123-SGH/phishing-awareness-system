{# Shared modals available on every public page. #}

<!-- YouTube player modal -->
<div class="modal-backdrop" id="videoModal" role="dialog" aria-modal="true"
     aria-labelledby="videoModalTitle" aria-hidden="true">
  <div class="modal modal--wide">
    <div class="modal__head">
      <div>
        <span class="eyebrow">Awareness video</span>
        <h3 id="videoModalTitle" data-video-title>Awareness video</h3>
      </div>
      <button class="modal__close" data-modal-close aria-label="Close video">&times;</button>
    </div>
    <div class="video-frame">
      <iframe title="Awareness video player" allow="accelerometer; autoplay; encrypted-media; picture-in-picture"
              allowfullscreen src=""></iframe>
    </div>
    <p class="mt-2" data-video-description></p>
  </div>
</div>

<!-- Global loading overlay -->
<div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
  <div class="text-center">
    <div class="spinner"></div>
    <p class="dim mt-1">Working on it…</p>
  </div>
</div>
