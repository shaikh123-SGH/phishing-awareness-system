<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Learn to identify phishing, online fraud, OTP, UPI and QR-code scams, and respond safely. A community cybersecurity awareness platform.{% endblock %}">
  <title>{% block title %}CyberAware{% endblock %} | Phishing Scam &amp; Fraud Detection Awareness Program</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include 'components/navbar.html' %}
  {% include 'components/flash_messages.html' %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}
  {% include 'components/modals.html' %}

  <script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
  <script src="{{ url_for('static', filename='js/animations.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
