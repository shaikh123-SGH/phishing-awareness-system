{% extends 'base.html' %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="text-center">
    <h1 style="font-size:4rem">404</h1>
    <h2>Page not found</h2>
    <p>{% if message %}{{ message }}{% else %}The page you were looking for does not exist or has moved.{% endif %}</p>
    <a class="btn btn--primary mt-2" href="{{ url_for('main.index') }}">Back to home</a>
  </div>
</section>
{% endblock %}
